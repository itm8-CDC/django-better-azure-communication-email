[tox]
isolated_build = true
envlist =
    py{3.8,3.9,3.10,3.11,3.12}-django-42
    py{3.10,3.11,3.12}-django-50
    py{3.10,3.11,3.12,3.13}-django-51
    py{3.10,3.11,3.12,3.13}-django-52

[testenv]
description = run unit tests
require_locked_deps = true
deps =
    pytest
    pytest-django
    codecov>=2.0.0
    django-42: Django>=4.2,<5.0
    django-50: Django>=5.0,<5.1
    django-51: Django>=5.1,<5.2
    django-52: Django>=5.2
extras =
    test
commands =
    coverage run -m pytest
    coverage xml
