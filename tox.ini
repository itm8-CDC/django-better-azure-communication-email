[tox]
isolated_build = true
envlist =
    py{38,39,310,311,312}-django-42
    py{310,311,312}-django-50
    py{310,311,312,313}-django-51
    py{310,311,312,313}-django-52
    py{312,313}-django-60
    py{312,313}-django-61

[testenv]
description = run unit tests
require_locked_deps = true
deps =
    pytest
    pytest-django
    codecov>=2.0.0
    django-42: Django>=4.2,<5.0
    django-50: Django>=5.0,<5.1
    django-51: Django>=5.1,<5.2
    django-52: Django>=5.2,<6.0
    django-60: Django>=6.0,<6.1
    django-61: Django>=6.1,<6.2
extras =
    test
commands =
    coverage run -m pytest
    coverage xml
